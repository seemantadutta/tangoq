app-id: io.github.seemantadutta.tangoq
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: tangoq
rename-icon: tangoq
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --share=ipc
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music
  - --filesystem=/media
  - --filesystem=/run/media
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.RealtimeKit1
  - --talk-name=org.freedesktop.ScreenSaver
  - --env=ALSA_CONFIG_PATH=
  - --metadata=X-DConf=migrate-path=/io/github/seemantadutta/tangoq
  - --persist=.tangoq
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: "25.08"
    add-ld-path: lib
    merge-dirs: lv2
    subdirectories: true
    no-autodownload: true
cleanup:
  - "*.a"
  - "*.la"
modules:
  - modules/libmad.yaml
  - modules/lv2.yaml
  - modules/serd.yaml
  - modules/zix.yaml
  - modules/sord.yaml
  - modules/sratom.yaml
  - modules/lilv.yaml
  - modules/googletest.yaml
  - modules/benchmark.yaml
  - modules/gsl.yaml
  - modules/protobuf.yaml
  - modules/portaudio.yaml
  - modules/portmidi.yaml
  - modules/hidapi.yaml
  - modules/chromaprint.yaml
  - modules/rubberband.yaml
  - modules/soundtouch.yaml
  - modules/libid3tag.yaml
  - modules/upower.yaml
  - modules/fdk-aac-free.yaml
  - modules/libmodplug.yaml
  - modules/qtkeychain.yaml
  - modules/libebur128.yaml
  - modules/libkeyfinder.yaml
  - modules/libdjinterop.yaml
  - name: mixxx
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DINSTALL_USER_UDEV_RULES=OFF
      - -DBUILD_BENCH=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../../
      - commands:
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - exec tangoq.bin "$@"
        type: script
        dest-filename: tangoq.sh
    cleanup:
      - /share/icons/hicolor/scalable/apps/mixxx_ios.svg
      - /share/icons/hicolor/scalable/apps/mixxx_macos.svg
    post-install:
      - desktop-file-edit --set-key="Exec" --set-value="tangoq %U" ${FLATPAK_DEST}/share/applications/io.github.seemantadutta.tangoq.desktop
      - mv ${FLATPAK_DEST}/bin/tangoq ${FLATPAK_DEST}/bin/tangoq.bin
      - install -Dm755 tangoq.sh ${FLATPAK_DEST}/bin/tangoq
      - install -Dm644 ./res/linux/io.github.seemantadutta.tangoq.metainfo.xml /app/share/metainfo/io.github.seemantadutta.tangoq.metainfo.xml
      - install -d /app/extensions/Plugins
